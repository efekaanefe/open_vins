%YAML:1.0

# KITTI capture date 2011_09_30. Generated by scripts/kitti/make_kitti_configs.py.
# *_sync images are rectified, so intrinsics are P_rect_00 and distortion is exactly zero.
#   T_imu_cam = (R_rect_00 * T_cam0_velo * T_velo_imu)^-1

cam0:
  T_imu_cam: #rotation from camera to IMU R_CtoI, position of camera in IMU p_CinI
    - [-0.001088634, -0.008512072, 0.999963181, 1.143898706]
    - [-0.999976401, -0.006777673, -0.001146344, -0.312718471]
    - [0.006787179, -0.999940733, -0.008504492, 0.726546045]
    - [0.000000000, 0.000000000, 0.000000000, 1.000000000]
  cam_overlaps: []
  camera_model: pinhole
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan
  intrinsics: [707.0912, 707.0912, 601.8873, 183.1104] #fu, fv, cu, cv
  resolution: [1226, 370]
  rostopic: /cam0/image_raw
  timeshift_cam_imu: 0.055 # t_imu = t_cam + shift; online estimate converges to 0.044-0.063 s on every drive
